<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QRコード作成｜履修ナビ</title>
  <style>
    :root { --brand: #1d4ed8; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef2f8;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.1);
      padding: 24px;
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p.sub { margin: 0 0 18px; font-size: 12px; color: #64748b; line-height: 1.7; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #dbe4f5;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    input:focus { border-color: var(--brand); }
    .qr-wrap {
      margin: 18px auto 10px;
      width: 240px;
      height: 240px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      overflow: hidden;
    }
    .qr-wrap img { width: 100%; height: 100%; object-fit: contain; display: none; }
    .qr-wrap img.is-on { display: block; }
    .hint { font-size: 11px; color: #64748b; line-height: 1.7; margin: 10px 0 0; }
    .placeholder { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>QRコード作成</h1>
    <p class="sub">公開したアプリのURLを入れると、発表用のQRコードができます。</p>

    <input id="url" type="url" inputmode="url" placeholder="https://xxxx.netlify.app/" autocomplete="off" />

    <div class="qr-wrap">
      <span class="placeholder" id="placeholder">URLを入力してください</span>
      <img id="qr" alt="QRコード" />
    </div>

    <p class="hint">
      画像を長押し（スマホ）または右クリック（PC）で保存し、スライドに貼ってください。<br />
      QRは発表前に一度生成すれば、当日はネット不要で使えます。
    </p>
  </div>

  <script>
    const input = document.getElementById("url");
    const img = document.getElementById("qr");
    const placeholder = document.getElementById("placeholder");

    function update() {
      const url = input.value.trim();
      if (!url) {
        img.classList.remove("is-on");
        img.removeAttribute("src");
        placeholder.style.display = "block";
        return;
      }
      placeholder.style.display = "none";
      img.classList.add("is-on");
      img.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=24&data=" +
        encodeURIComponent(url);
    }

    input.addEventListener("input", update);
    input.addEventListener("change", update);
  </script>
</body>
</html>
